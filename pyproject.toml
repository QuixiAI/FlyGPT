[project]
name = "flygpt"
version = "0.0.1"
description = "A language model whose recurrent core is the fruit-fly connectome."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
demo = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flygpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
