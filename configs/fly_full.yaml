# V2: full MaleCNS graph. Do not block V0 on this.
name: fly_full
model_type: fly
graph:
  source: fly
  n_neurons: 200000  # take everything
  n_input: 1024
  n_output: 4096
  io_rule: random
model:
  embed_dim: 32
  microsteps: 1
data:
  task: shakespeare
  seq_len: 64
  batch_size: 32
train:
  steps: 20000
  eval_every: 250
  sample_every: 500
  lr_recurrent: 3.0e-4
  lr_adapters: 1.0e-3
